name: Publish Android artifact to Vitruvian's Maven Artifact Registry (GCP)

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish ankers.compose.router:core-android
        run: |
          ENCODED_SECRET=$(printf '%s' "$GCP_CREDENTIALS" | base64 -w 0)
          ARGS=""
          if [ "${{ github.event_name }}" = "release" ]; then
            ARGS="-PpublishVersion=${GITHUB_REF_NAME#v}"
          fi
          ./gradlew :core:publishAndroidReleasePublicationToArtifactRegistryRepository -PartifactRegistryMavenSecret="${ENCODED_SECRET}" ${ARGS}
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
